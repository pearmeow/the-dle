name: Daily game pool

# Run generator code from the workflow's branch; publish boards and cooldown
# history together to naxin, the branch read by released game clients.
#
# RAWG_API_KEY is a repository secret (Settings -> Secrets and
# variables -> Actions). It is never written to the repo or exposed
# to any client.

on:
  schedule:
    # 04:05 UTC ~ 00:05 US-Eastern. Pick any cadence you prefer.
    - cron: "5 4 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to generate for (YYYY-MM-DD). Leave empty for today."
        required: false
        default: ""

concurrency:
  group: daily-game-pool
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout generator source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout published data and history
        uses: actions/checkout@v4
        with:
          ref: naxin
          path: daily-data

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch today's RAWG pool
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          BOARD_DATE: ${{ github.event.inputs.date }}
        run: |
          args=()
          if [ -n "$BOARD_DATE" ]; then
            args+=(--date "$BOARD_DATE")
          fi
          python source/tools/fetch_pool.py "${args[@]}" --pages 20 \
            --output daily-data/data/daily_pool.json \
            --history daily-data/data/daily_history.json

      - name: Commit updated pool
        working-directory: daily-data
        run: |
          git config user.name  "pool-bot"
          git config user.email "pool-bot@users.noreply.github.com"
          git add data/daily_pool.json data/daily_history.json
          if git diff --cached --quiet; then
            echo "No pool changes to commit."
          else
            git commit -m "chore: daily pool $(date -u +%F)"
            git push origin naxin
          fi
